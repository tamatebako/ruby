# JSON Schema (draft 2020-12) for patches/<line>/patch-<line>[.<patch>].yaml
# line patch manifests.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: tfs-ruby line patch manifest
type: object
required: [version, patches]
additionalProperties: false
properties:
  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"
  patches:
    type: array
    items:
      type: object
      required: [feature, file]
      additionalProperties: false
      properties:
        feature:
          type: string
          pattern: "^[a-z0-9]+(_[a-z0-9]+)*$"
        file:
          type: string
          pattern: "^(\\.\\./[0-9]+\\.[0-9]+/)?[a-z0-9]+(_[a-z0-9]+)*\\.patch$"
        version:
          type: string
          pattern: "^[0-9]+$"
