# JSON Schema (draft 2020-12) for versions.yml — the supported ruby versions.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: tfs-ruby versions manifest
type: object
required: [versions]
additionalProperties: false
properties:
  versions:
    type: object
    minProperties: 1
    additionalProperties: false
    patternProperties:
      "^[0-9]+\\.[0-9]+\\.[0-9]+$":
        type: object
        required: [url, sha256, line]
        additionalProperties: false
        properties:
          url:
            type: string
            pattern: "^https://cache\\.ruby-lang\\.org/pub/ruby/[0-9]+\\.[0-9]+/ruby-[0-9]+\\.[0-9]+\\.[0-9]+\\.tar\\.gz$"
          sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          line:
            type: string
            pattern: "^[0-9]+\\.[0-9]+$"
          # platform scenarios this version ships src releases for;
          # absent means linux-gnu only. linux-gnu is mandatory: it is
          # the unsuffixed back-compat asset.
          scenarios:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              enum: [linux-gnu, linux-musl, msys]
            contains:
              const: linux-gnu
