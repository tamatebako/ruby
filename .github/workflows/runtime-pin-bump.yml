name: runtime-pin-bump

# Closes the drift loop: whenever release-src publishes a source release
# successfully, tell tamatebako/tebako-runtime-ruby to open a PR bumping
# its DEFAULT_RELEASE pin to the tag just published. Cross-repo mechanism
# matches the existing one (release-monitor.yml): repository_dispatch via
# `gh api`, authenticated with the TEBAKO_CI_PAT_TOKEN secret. No actions
# are used (only the preinstalled gh CLI), so there is nothing to pin.
#
# Idempotent: a re-run of release-src for an already-published tag simply
# re-sends the same dispatch; the runtime side no-ops when the pin is
# already at that tag or its bump branch already exists.

on:
  workflow_run:
    workflows: ["release-src"]
    types: [completed]

permissions:
  actions: read # download the release-tag artifact from the triggering run
  contents: read

jobs:
  dispatch:
    name: dispatch pin bump for the published tag
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: read the tag the triggering run published
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-tag --dir tag-out
          tag=$(tr -d '[:space:]' < tag-out/release-tag.txt)
          case "$tag" in
            v*) ;;
            *) echo "::error::refusing to dispatch for unexpected tag '$tag'"; exit 1 ;;
          esac
          echo "published tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: dispatch to tebako-runtime-ruby
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api repos/tamatebako/tebako-runtime-ruby/dispatches \
            -f event_type='tfs-ruby-src-release' \
            -F "client_payload[tag]=$TAG"
