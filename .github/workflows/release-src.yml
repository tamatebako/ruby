name: release-src

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish the source tarballs to
        required: true
        default: v0.0.0

jobs:
  versions:
    name: emit version x scenario matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - id: emit
        run: echo "matrix=$(tools/versions --scenarios)" >> "$GITHUB_OUTPUT"

  changes:
    name: map changed patch lines to compile-smoke legs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch tags (previous-release diff base)
        run: git fetch --tags --force
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - id: emit
        run: echo "matrix=$(tools/smoke_matrix "${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}")" >> "$GITHUB_OUTPUT"

  # Publish gate (roadmap 17.0; the v0.2.8 lesson: a patch release shipped
  # apply-clean but uncompilable and broke every linux runtime leg). For
  # every line whose patch set changed in the tag (tools/smoke_matrix diffs
  # the tag against the previous release tag), configure the tree and
  # compile each patched translation unit of the line's NEWEST version per
  # shipped scenario -- a representative per-line leg, not per-version:
  # patches are line-wide, so per-version legs would multiply configure
  # runs for no extra signal. The compile is the cheapest that catches a
  # broken shim: ./configure + make <obj> per patched .c (objects only --
  # no runtime build, no link, no exts), against the vendored stub tebako
  # headers in ci/include. msys legs compile at pass 2 (the pass split
  # selects GNUmakefile variants; no patched .c differs between passes).
  # With no changed patch set the matrix is empty and the gate is vacuous;
  # publish's if: below treats that (skipped) as pass, failure as block.
  compile-smoke:
    name: compile-smoke ${{ matrix.version }} (${{ matrix.platform }})
    needs: changes
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: scenario toolchain
        run: |
          sudo apt-get update -qq
          case "${{ matrix.platform }}" in
            linux-musl) sudo apt-get install -y -qq musl-tools ;;
            msys) sudo apt-get install -y -qq gcc-mingw-w64-x86-64 ;;
          esac
      - name: configure + compile patched translation units
        run: tools/compile_smoke "${{ matrix.version }}" "$PWD/build/compile-smoke" --platform "${{ matrix.platform }}"

  build:
    name: tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}
    needs: versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: validate manifests against schema
        run: bundle exec tools/validate_manifests
      - name: apply patches
        run: tools/apply "${{ matrix.version }}" "$PWD/build" --platform "${{ matrix.platform }}" --pass "${{ matrix.pass }}"
      - name: package
        working-directory: build
        run: |
          tar -czf "tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}.tar.gz" "tfs-ruby-${{ matrix.version }}-src"
          sha256sum "tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}.tar.gz" > "tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}.tar.gz.sha256"
      - name: extract-verify
        working-directory: build
        run: |
          mkdir verify
          tar -xzf "tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}.tar.gz" -C verify
          diff -qr "tfs-ruby-${{ matrix.version }}-src" "verify/tfs-ruby-${{ matrix.version }}-src"
      - uses: actions/upload-artifact@v4
        with:
          name: tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}
          path: build/tfs-ruby-${{ matrix.version }}-src${{ matrix.suffix }}.tar.gz*
          retention-days: 1

  publish:
    name: publish release
    needs: [build, compile-smoke, changes]
    # compile-smoke runs legs only for changed patch lines; with no changed
    # patch set its matrix is empty (result skipped/success -- vacuous
    # pass). Publish only when the leg map was computed, every build leg
    # passed, and no smoke leg failed or was cancelled.
    if: ${{ always() && needs.build.result == 'success' && needs.changes.result == 'success' && (needs.compile-smoke.result == 'success' || needs.compile-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tfs-ruby-*-src*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
      # Record the published tag so the workflow_run follow-up
      # (runtime-pin-bump.yml) can read it back deterministically for both
      # trigger paths (tag push and manual dispatch).
      - name: record release tag
        run: echo "${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}" > release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-tag.txt
          retention-days: 1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
